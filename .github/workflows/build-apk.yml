name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Create fresh Expo project (matching versions)
        run: |
          npx --yes create-expo-app@latest build-app --template blank --no-install
          cp App.js build-app/App.js
          cd build-app
          npm install
          npx expo install @react-native-async-storage/async-storage @expo/vector-icons
          node -e "
            const fs=require('fs');const a=JSON.parse(fs.readFileSync('app.json'));
            a.expo.name='အလုပ်သမားစာရင်း';a.expo.slug='worker-name-list';
            a.expo.userInterfaceStyle='dark';a.expo.backgroundColor='#0A0A12';
            a.expo.android=Object.assign(a.expo.android||{},{package:'com.kyaw.workernamelist',versionCode:1});
            fs.writeFileSync('app.json',JSON.stringify(a,null,2));"
      - name: Generate Android project
        working-directory: build-app
        run: npx expo prebuild --platform android --no-install
      - name: Build APK
        working-directory: build-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: worker-name-list-apk
          path: build-app/android/app/build/outputs/apk/release/app-release.apk
